<section
  class="state-panel"
  [class.state-error]="tone() === 'error'"
  [attr.role]="tone() === 'error' ? 'alert' : 'status'"
>
  <ion-icon [name]="icon()" aria-hidden="true"></ion-icon>
  <h2>{{ heading() }}</h2>
  @if (message()) {
  <p>{{ message() }}</p>
  }
  @if (actionLabel()) {
  <ion-button
    [fill]="tone() === 'error' ? 'solid' : 'outline'"
    (click)="action.emit()"
    >{{ actionLabel() }}</ion-button
  >
  }
</section>
